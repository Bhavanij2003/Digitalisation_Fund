<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SBF Digitisation — Verify</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="topbar">
    <div class="brand">Suryan Benefit Fund<small>Form Digitisation Register</small></div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="upload.html">Upload</a>
      <a href="search.html">Search &amp; Export</a>
    </nav>
  </div>

  <div class="wrap">
    <h1 class="page-title" id="pageTitle">Verify document</h1>
    <p class="page-sub" id="pageSub">Loading…</p>

    <div id="errorsHolder"></div>
    <div id="reliabilityWarning"></div>

    <div class="verify-grid" id="verifyGrid" style="display:none;">
      <div class="image-panel">
        <div class="image-toolbar">
          <button onclick="zoom(1.2)">Zoom in</button>
          <button onclick="zoom(0.8)">Zoom out</button>
          <button onclick="rotateImg()">Rotate</button>
          <button onclick="resetView()">Reset</button>
          <button class="ghost" id="toggleOriginal" onclick="toggleOriginal()">Show original</button>
        </div>
        <div class="image-viewport" id="viewport">
          <img id="formImage" src="" alt="Uploaded form">
        </div>
      </div>

      <div>
        <div class="panel" style="margin-bottom:14px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div class="doc-number" id="docNumber"></div>
              <div id="docStatus" style="margin-top:4px;"></div>
            </div>
            <div style="text-align:right; font-size:12px; color:var(--ink-soft);">
              Uploaded by <span id="uploadedBy"></span><br>
              <span id="uploadDate"></span>
            </div>
          </div>
        </div>

        <div id="fieldsHolder"></div>

        <div class="btn-row panel" style="margin-top:14px;">
          <button onclick="submitAction('approve')">Approve</button>
          <button class="secondary" onclick="submitAction('draft')">Save draft</button>
          <button class="ghost" onclick="reprocess()">Reprocess OCR</button>
          <button class="danger" onclick="submitAction('duplicate')">Mark duplicate</button>
          <button class="danger" onclick="submitAction('reject')">Reject</button>
        </div>
      </div>
    </div>
  </div>

<script src="app.js"></script>
<script>
const params = new URLSearchParams(location.search);
const docId = params.get("id");
let currentDoc = null;
let currentFields = [];
let zoomLevel = 1;
let rotation = 0;
let showingOriginal = false;

if (!docId) {
  document.getElementById("pageSub").textContent = "No document id given. Open this page from the dashboard.";
} else {
  loadDoc();
}

async function loadDoc() {
  try {
    const data = await apiGet(`/api/document/${docId}`);
    currentDoc = data.document;
    currentFields = data.fields;
    renderDoc();
  } catch (e) {
    document.getElementById("pageSub").textContent = "Could not load document: " + e.message;
  }
}

function renderDoc() {
  document.getElementById("pageTitle").textContent =
    `Verify — ${currentDoc.form_type === "deposit" ? "Deposit Application Form" : "Application for Share"}`;
  document.getElementById("pageSub").textContent = "Review the OCR results on the right against the scanned form on the left, then approve.";
  document.getElementById("docNumber").textContent = currentDoc.document_number;
  document.getElementById("docStatus").innerHTML = statusBadge(currentDoc.processing_status);
  document.getElementById("uploadedBy").textContent = currentDoc.uploaded_by || "—";
  document.getElementById("uploadDate").textContent = new Date(currentDoc.upload_date).toLocaleString();

  const img = document.getElementById("formImage");
  img.src = fileUrl(currentDoc.processed_file_path) || fileUrl(currentDoc.original_file_path);
  document.getElementById("verifyGrid").style.display = "grid";

  renderReliabilityWarning();
  renderFields();
}

function renderReliabilityWarning() {
  const holder = document.getElementById("reliabilityWarning");
  // perspective_cropped / aligned_to_reference are stored as 0/1/NULL.
  // 0 specifically means "we tried and it did NOT succeed" — worth flagging.
  // NULL (missing/undefined) means we don't know (e.g. older record before
  // this check existed), so we stay silent rather than guessing.
  const perspectiveFailed = currentDoc.perspective_cropped === 0;
  const alignFailed = currentDoc.aligned_to_reference === 0;

  if (!perspectiveFailed && !alignFailed) {
    holder.innerHTML = "";
    return;
  }

  let reasons = [];
  if (perspectiveFailed) {
    reasons.push("the photo could not be confidently cropped to the paper's edges (background may still be in frame)");
  }
  if (alignFailed) {
    reasons.push("the photo could not be aligned to the blank template");
  }

  holder.innerHTML = `
    <div class="panel" style="border-left:4px solid var(--warn, #b45309); background:#fff8ec; margin-bottom:14px;">
      <strong>Field positions may be unreliable for this scan.</strong>
      <div style="margin-top:4px; font-size:14px;">
        ${reasons.join(" and ")}. Field crops below were taken using the
        standard fixed coordinates without this correction, so values may be
        misaligned — check each field carefully against the image on the left,
        or try <em>Reprocess OCR</em> after retaking the photo straight-on,
        filling the frame, with a plain contrasting background.
      </div>
    </div>`;
}

function renderFields() {
  const holder = document.getElementById("fieldsHolder");
  holder.innerHTML = currentFields.map(f => {
    const band = f.confidence_band || "red";
    const cardClass = band === "green" ? "high-conf" : band === "orange" ? "mid-conf" : "low-conf";
    const value = (f.corrected_value ?? f.ocr_value ?? "");
    return `
      <div class="field-card ${cardClass}">
        <div class="field-head">
          <span class="field-name">${f.field_name.replace(/_/g, " ")}</span>
          ${confidenceBadge(band, f.confidence_score)}
        </div>
        <input type="text" data-field="${f.field_name}" value="${escapeAttr(value)}">
        ${f.ocr_value && f.ocr_value !== value ? `<div class="ocr-orig">OCR read: ${escapeHtml(f.ocr_value)}</div>` : ""}
      </div>`;
  }).join("");
}

function escapeAttr(s) { return String(s).replace(/"/g, "&quot;"); }
function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function zoom(factor) {
  zoomLevel = Math.min(4, Math.max(0.3, zoomLevel * factor));
  applyTransform();
}
function rotateImg() {
  rotation = (rotation + 90) % 360;
  applyTransform();
}
function resetView() {
  zoomLevel = 1; rotation = 0;
  applyTransform();
}
function applyTransform() {
  document.getElementById("formImage").style.transform = `scale(${zoomLevel}) rotate(${rotation}deg)`;
}
function toggleOriginal() {
  showingOriginal = !showingOriginal;
  const img = document.getElementById("formImage");
  img.src = showingOriginal ? fileUrl(currentDoc.original_file_path) : (fileUrl(currentDoc.processed_file_path) || fileUrl(currentDoc.original_file_path));
  document.getElementById("toggleOriginal").textContent = showingOriginal ? "Show processed" : "Show original";
}

function collectCorrections() {
  const inputs = document.querySelectorAll("#fieldsHolder input[data-field]");
  const out = {};
  inputs.forEach(i => out[i.dataset.field] = i.value);
  return out;
}

async function submitAction(action) {
  const verifiedBy = prompt("Your name / employee ID, to record who verified this:", currentDoc.verified_by || "");
  if (verifiedBy === null) return;

  document.getElementById("errorsHolder").innerHTML = "";
  try {
    const result = await apiPostJSON(`/api/document/${docId}/verify`, {
      corrected_fields: collectCorrections(),
      verified_by: verifiedBy || "staff",
      action,
    });
    toast(result.status || "Saved", "success");
    if (result.status !== "Draft saved") {
      setTimeout(() => location.href = "index.html", 900);
    } else {
      loadDoc();
    }
  } catch (e) {
    if (e.status === 422 && e.data && e.data.errors) {
      document.getElementById("errorsHolder").innerHTML = `
        <div class="errors-box"><strong>Please fix before approving:</strong>
        <ul>${e.data.errors.map(x => `<li>${x}</li>`).join("")}</ul></div>`;
    } else {
      toast(e.message, "error");
    }
  }
}

async function reprocess() {
  if (!confirm("Re-run OCR on this document? Unsaved corrections will be lost.")) return;
  try {
	const fd = new FormData();
	fd.append("form_type_hint", "");
    const res = await fetch(`${API_BASE}/api/document/${docId}/reprocess`, { method: "POST", body: fd });
    if (!res.ok) throw new Error(await res.text());
    toast("Reprocessed", "success");
    loadDoc();
  } catch (e) {
    toast("Reprocess failed: " + e.message, "error");
  }
}
</script>
</body>
</html>
